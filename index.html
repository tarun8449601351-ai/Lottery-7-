/* ===== FULL PAGE ===== */
html,body{

  min-height:100%!important;
  background:#050611!important;
}

#tarun-vip-page,
#tarun-vip-page *{
  box-sizing:border-box;
}

#tarun-vip-page{
  width:100%;
  min-height:100vh;
  padding:24px 10px 45px;
  position:relative;
  overflow:hidden;

  display:flex;
  justify-content:center;
  align-items:flex-start;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(91,40,190,.32),
      transparent 42%
    ),
    radial-gradient(
      circle at 15% 75%,
      rgba(35,78,180,.14),
      transparent 40%
    ),
    #050611;

  font-family:Georgia,"Times New Roman",serif;
}


/* ===== BACKGROUND LIGHTS ===== */

#tarun-vip-page:before{
  content:"";
  position:absolute;

  width:430px;
  height:430px;

  top:-230px;
  left:50%;

  transform:translateX(-50%);

  border-radius:50%;

  background:radial-gradient(
    circle,
    rgba(111,43,235,.42),
    rgba(79,32,175,.16) 42%,
    transparent 70%
  );

  filter:blur(25px);

  animation:bgGlow 6s ease-in-out infinite alternate;
}

#tarun-vip-page:after{
  content:"";
  position:absolute;

  width:340px;
  height:340px;

  right:-190px;
  bottom:-100px;

  border-radius:50%;

  background:radial-gradient(
    circle,
    rgba(42,92,235,.24),
    transparent 70%
  );

  filter:blur(35px);
}

@keyframes bgGlow{
  from{
    opacity:.55;
    transform:translateX(-50%) scale(.92);
  }
  to{
    opacity:1;
    transform:translateX(-50%) scale(1.08);
  }
}


/* ===== CARD ===== */

.tv-card{
  width:100%;
  max-width:405px;

  position:relative;
  z-index:5;

  padding:45px 23px 36px;

  border-radius:31px;

  text-align:center;

  background:
    radial-gradient(
      circle at 50% 22%,
      rgba(94,38,175,.14),
      transparent 38%
    ),
    linear-gradient(
      145deg,
      #0d0f22,
      #070816 65%,
      #090618
    );

  border:1px solid rgba(119,69,220,.38);

  box-shadow:
    0 20px 60px rgba(0,0,0,.58),
    0 0 32px rgba(91,42,185,.16),
    inset 0 0 55px rgba(80,40,165,.05);

  overflow:hidden;
}


/* ===== CARD TOP LINE ===== */

.tv-card-line{
  position:absolute;

  top:0;
  left:12%;

  width:76%;
  height:2px;

  background:linear-gradient(
    90deg,
    transparent,
    #873bef,
    #4394ff,
    #873bef,
    transparent
  );

  box-shadow:0 0 12px rgba(105,55,235,.8);
}


/* ===== CARD LIGHT ===== */

.tv-card-light{
  position:absolute;

  width:270px;
  height:270px;

  top:-130px;
  left:50%;

  transform:translateX(-50%);

  border-radius:50%;

  background:radial-gradient(
    circle,
    rgba(113,44,228,.18),
    transparent 68%
  );

  filter:blur(28px);

  animation:cardGlow 5s ease-in-out infinite alternate;

  pointer-events:none;
}

@keyframes cardGlow{
  from{
    opacity:.5;
    transform:translateX(-50%) scale(.9);
  }
  to{
    opacity:1;
    transform:translateX(-50%) scale(1.12);
  }
}


/* ===== TOP BRAND ===== */

.tv-brand{
  position:relative;
  z-index:3;

  margin-bottom:27px;

  color:#43a1ff;

  font-family:Arial,Helvetica,sans-serif;

  font-size:12px;
  font-weight:700;

  letter-spacing:6px;

  text-shadow:
    0 0 8px rgba(55,151,255,.8);
}


/* ===== PROFILE ===== */

.tv-profile{
  width:178px;
  height:178px;

  margin:0 auto 35px;

  padding:6px;

  position:relative;

  border-radius:50%;

  background:linear-gradient(
    135deg,
    #6728e9,
    #a64bf3,
    #3d8cff,
    #672be5
  );

  box-shadow:
    0 0 16px rgba(104,44,232,.75),
    0 0 38px rgba(62,91,220,.30);
}


/* outer ring */

.tv-profile:before{
  content:"";

  position:absolute;

  inset:-5px;

  border-radius:50%;

  border:1px solid rgba(148,91,255,.65);

  box-shadow:
    0 0 14px rgba(105,55,235,.65);
}


/* image */

.tv-profile img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  border-radius:50%;

  border:4px solid #070816;

  box-shadow:
    inset 0 0 22px rgba(0,0,0,.8);
}


/* ===== TITLE ===== */

.tv-title{
  position:relative;
  z-index:3;

  margin:0;

  color:#f7f2ff;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:42px;

  line-height:1;

  font-style:italic;
  font-weight:900;

  letter-spacing:.5px;

  text-transform:uppercase;

  text-shadow:
    0 3px 15px rgba(0,0,0,.85);
}

.tv-title span{
  display:block;

  margin-top:7px;

  background:linear-gradient(
    90deg,
    #9650ea,
    #c486f4,
    #914be6
  );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}


/* ===== DIVIDER ===== */

.tv-divider{
  width:78px;
  height:2px;

  margin:23px auto 25px;

  background:linear-gradient(
    90deg,
    transparent,
    #8b3ce9,
    #4396ff,
    transparent
  );

  box-shadow:
    0 0 9px rgba(96,62,225,.8);
}


/* ===== DESCRIPTION ===== */

.tv-description{
  position:relative;
  z-index:3;

  max-width:315px;

  margin:0 auto 32px;

  color:#9da1c1;

  font-size:15px;

  line-height:1.5;
}


/* ===== BUTTON ===== */

.tv-button{
  width:100%;
  height:82px;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  border-radius:20px;

  text-decoration:none!important;

  background:linear-gradient(
    100deg,
    #7928df 0%,
    #8d39ed 44%,
    #436fe7 100%
  );

  border:1px solid rgba(220,195,255,.34);

  box-shadow:
    0 7px 25px rgba(83,39,181,.40),
    0 0 20px rgba(83,55,214,.22),
    inset 0 1px 1px rgba(255,255,255,.25);

  transition:.2s ease;
}


/* ===== MOVING SHINE ===== */

.tv-button:before{
  content:"";

  position:absolute;

  top:-35%;
  left:-75%;

  width:34%;
  height:170%;

  transform:skewX(-20deg);

  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.82),
    transparent
  );

  animation:buttonShine 2.7s ease-in-out infinite;

  pointer-events:none;
}

@keyframes buttonShine{
  0%{
    left:-75%;
  }

  42%{
    left:135%;
  }

  100%{
    left:135%;
  }
}


/* ===== BUTTON CONTENT ===== */

.tv-button-text{
  position:relative;
  z-index:3;

  color:#fff;

  font-size:19px;

  font-weight:900;

  letter-spacing:1.2px;

  text-shadow:
    0 2px 7px rgba(0,0,0,.25);
}

.tv-arrow{
  position:relative;
  z-index:3;

  margin-left:11px;

  color:#fff;

  font-family:Arial,sans-serif;

  font-size:27px;

  animation:arrowMove 1.4s ease-in-out infinite;
}

@keyframes arrowMove{
  0%,100%{
    transform:translateX(0);
  }

  50%{
    transform:translateX(4px);
  }
}


/* ===== HOVER ===== */

.tv-button:hover{
  transform:translateY(-2px);

  box-shadow:
    0 10px 30px rgba(83,39,181,.52),
    0 0 27px rgba(83,55,214,.34),
    inset 0 1px 1px rgba(255,255,255,.30);
}

.tv-button:active{
  transform:scale(.985);
}


/* ===== NOTE ===== */

.tv-note{
  position:relative;
  z-index:3;

  margin:21px 0 0;

  color:#666a8e;

  font-family:Arial,Helvetica,sans-serif;

  font-size:11px;
}


/* ===== MOBILE ===== */

@media(max-width:600px){

  #tarun-vip-page{

  .tv-button{

  }
}


/* ===== SMALL PHONES ===== */

@media(max-width:350px){

  }

  }

    font-size:16px;
  }
}
