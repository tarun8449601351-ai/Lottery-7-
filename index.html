padding:0;

body{
background:#efefef;
display:flex;
justify-content:center;
align-items:center;

.card{
width:100%;
max-width:430px;
background:#fff;
border-radius:40px;
padding:35px 20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.dp{
width:180px;
height:180px;
margin:auto;
border:10px solid red;
border-radius:50%;
overflow:hidden;
}

.dp img{
width:100%;
height:100%;
object-fit:cover;
}

h1{
font-size:42px;
font-weight:800;
margin:35px 0;
color:#000;
}

.btn{
display:block;
width:100%;

color:#fff;
text-decoration:none;
padding:28px;
border-radius:60px;
font-size:24px;
font-weight:700;
margin:25px 0;
}

.timer{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin:30px 0;
}

.box{
background:#fafafa;
border:1px solid #e5e5e5;
border-radius:25px;
padding:25px 10px;
}

.num{
font-size:42px;
font-weight:800;
color:#ff2f6d;
}

.label{
font-size:14px;
font-weight:700;
color:#d400ff;
margin-top:8px;
}

@media(max-width:480px){

h1{
font-size:32px;
}

.dp{
width:150px;
height:150px;
}

.btn{
font-size:20px;
padding:22px;
}

.num{
font-size:32px;
}
}

<script>
const targetDate = new Date();
targetDate.setDate(targetDate.getDate() + 7);

function updateTimer() {
const now = new Date();
const diff = targetDate - now;

const days = Math.floor(diff / (1000*60*60*24));
const hours = Math.floor((diff/(1000*60*60)) % 24);
const minutes = Math.floor((diff/(1000*60)) % 60);
const seconds = Math.floor((diff/1000) % 60);

document.getElementById("days").innerText =
String(days).padStart(2,'0');

document.getElementById("hours").innerText =
String(hours).padStart(2,'0');

document.getElementById("minutes").innerText =
String(minutes).padStart(2,'0');

document.getElementById("seconds").innerText =
String(seconds).padStart(2,'0');
}

setInterval(updateTimer,1);
updateTimer();
</script>
